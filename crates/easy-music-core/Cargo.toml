[package]
name = "easy-music-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared core logic for EasyMusic: library management and playback engine."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
lofty = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
easy-music-plugin-sdk = { path = "../easy-music-plugin-sdk" }

[dev-dependencies]
tempfile = "3"
